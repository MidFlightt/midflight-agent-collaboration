<!doctype html><html lang="en"><meta charset="utf-8"><title>MidFlight · live coding team</title><link rel="stylesheet" href="/vendor/xterm.css"><style>
html,body{margin:0;height:100%;background:#101114;color:#ddd;font:13px system-ui}header{height:48px;display:flex;align-items:center;gap:16px;padding:0 15px}button,a{background:#273041;color:#eee;border:0;border-radius:4px;padding:7px 12px;cursor:pointer;text-decoration:none}button:disabled{opacity:.5;cursor:wait}#terminal{height:calc(100% - 48px);padding:0 8px}#note{margin-left:auto;font-size:12px;color:#c4c4cf}small{color:#9c9ca8}

</style><header><b>MidFlight · live coding team</b><small>Type your direction in <strong>any agent</strong></small><button id="reset">Reset</button><button id="colors" title="Blue: MidFlight calls. Orange: other agents. Red: objection calls and references.">Highlights: on</button><button id="fullscreen" title="Expand all four coding panes">Fullscreen</button><a href="/report" target="_blank" title="Recorded communication and test evidence">Run evidence</a><span id="note">Connecting…</span></header><div id="terminal"></div>
<script src="/vendor/xterm.js"></script><script src="/vendor/addon-fit.js"></script><script>
// BEGIN DEMO TEXT COLORS — presentation only; never edits the terminal stream.
function paneAgentAt(layout, x, y) {
  for (const [agent, p] of Object.entries(layout)) {
    if (x >= p.x && x < p.x + p.width && y >= p.y && y < p.y + p.height) return agent;
  }
  return null; // Borders, headings and unknown layout are never agent mentions.
}
function demoColorRanges(text, agentAt = () => null) {
  const cells = Array(text.length).fill(null);
  for (const match of text.matchAll(/\b(?:theater_)?midflight\.(?:join|send|check_in|objection|object)\b/g)) {
    cells.fill('#79bdff', match.index, match.index + match[0].length);
  }
  for (const match of text.matchAll(/\b(Billing|Delivery|Booking|Notifications) agent\b/gi)) {
    const owner = agentAt(match.index);
    if (owner && owner !== match[1].toLowerCase()) {
      cells.fill('#f7ba55', match.index, match.index + match[0].length);
    }
  }
  // Objection syntax takes precedence over the general tool-call blue.
  // This labels text, not whether an objection is open, resolved or justified.
  for (const match of text.matchAll(/\b(?:(?:theater_)?midflight\.(?:objection|object)|open_objections|objection_id|objections?|objected|objecting)\b(?:\s+#\d+)?/gi)) {
    // A field name alone is not an objection. Highlight only visible populated data.
    if (match[0].toLowerCase() === 'open_objections' &&
        !/^\s*["']?\s*:\s*\[\s*\{/.test(text.slice(match.index + match[0].length))) continue;
    // Ignore path components such as /runs/objection-20261017-205114.
    if (/[\/\\_-]/.test(text[match.index - 1] || '') || /[\/\\_-]/.test(text[match.index + match[0].length] || '')) continue;
    cells.fill('#ff6b6b', match.index, match.index + match[0].length);
  }
  const ranges = [];
  for (let start = 0; start < cells.length;) {
    let end = start + 1;
    while (end < cells.length && cells[end] === cells[start]) end++;
    if (cells[start]) ranges.push({start, end, color: cells[start]});
    start = end;
  }
  return ranges;
}
// Return display-only masks for the exact Codex quota banner, scoped to each pane.
// Model output, errors and terminal/transcript bytes remain untouched.
function quotaNoticeMasks(rows, layout) {
  const masks = [];
  for (const pane of Object.values(layout)) {
    let compact = ''; const lineAt = [], columnAt = [];
    for (let y = pane.y; y < Math.min(rows.length, pane.y + pane.height); y++) {
      const fragment = (rows[y] || '').slice(pane.x, pane.x + pane.width);
      for (let i = 0; i < fragment.length; i++) {
        if (!/\s/.test(fragment[i])) { compact += fragment[i]; lineAt.push(y); columnAt.push(pane.x + i); }
      }
    }
    const banner = /Headsup,youhavelessthan\d+%ofyourweeklylimitleft\.Run\/statusforabreakdown\./g;
    for (const match of compact.matchAll(banner)) {
      for (let y = lineAt[match.index]; y <= lineAt[match.index + match[0].length - 1]; y++) {
        masks.push({row: y, x: pane.x, width: pane.width});
      }
    }
    // Mask only the compact indicator, preserving neighboring status text.
    const weekly = /(?:⚠\ufe0f?)?weeklylimit:\d+%left[·•|]\/status/gi;
    for (const match of compact.matchAll(weekly)) {
      const last = match.index + match[0].length - 1;
      const firstRow = lineAt[match.index], lastRow = lineAt[last];
      for (let y = firstRow; y <= lastRow; y++) {
        const x = y === firstRow ? columnAt[match.index] : pane.x;
        const end = y === lastRow ? columnAt[last] + 1 : pane.x + pane.width;
        masks.push({row: y, x, width: end - x});
      }
    }
  }
  return masks;
}
// END DEMO TEXT COLORS
function installDemoTextColors(term, button) {
  let layout = {};
  let enabled = localStorage.getItem("midflight-text-colors") !== "off";
  function label() { button.textContent = "Highlights: " + (enabled ? "on" : "off"); button.setAttribute("aria-pressed", String(enabled)); }
  label();
  let pending = false, previousBuffer, previousCols;
  const decorated = new Map();
  function dispose(entry) { for (const decoration of entry.decorations) decoration.dispose(); entry.marker.dispose(); }
  function paint() {
    pending = false;
    if (!enabled) {
      for (const entry of decorated.values()) dispose(entry);
      decorated.clear();
    }
    const buffer = term.buffer.active;
    if (buffer !== previousBuffer || term.cols !== previousCols) {
      for (const entry of decorated.values()) dispose(entry);
      decorated.clear(); previousBuffer = buffer; previousCols = term.cols;
    }
    const screenRows = Array.from({length: term.rows}, (_, row) =>
      buffer.getLine(buffer.viewportY + row)?.translateToString(false) || '');
    const quotaMasks = quotaNoticeMasks(screenRows, layout);
    const visible = new Set();
    for (let row = 0; row < term.rows; row++) {
      const y = buffer.viewportY + row, line = buffer.getLine(y);
      if (!line) continue;
      visible.add(y);
      let text = ''; const columns = [], ends = [];
      for (let x = 0; x < line.length; x++) {
        const cell = line.getCell(x); if (!cell || cell.getWidth() === 0) continue;
        const chars = cell.getChars() || ' ';
        for (let i = 0; i < chars.length; i++) { columns.push(x); ends.push(x + cell.getWidth()); }
        text += chars;
      }
      const rowMasks = quotaMasks.filter(mask => mask.row === row);
      const signature = text + JSON.stringify(rowMasks) + enabled;
      const old = decorated.get(y);
      if (old?.text === signature && !old.marker.isDisposed && old.marker.line === y) continue;
      if (old) { dispose(old); decorated.delete(y); }
      const ranges = enabled ? demoColorRanges(text, index =>
        buffer.viewportY === buffer.baseY ? paneAgentAt(layout, columns[index], row) : null) : [];
      ranges.push(...rowMasks.map(mask => ({cellX: mask.x, cellWidth: mask.width,
        color: '#101114', backgroundColor: '#101114', layer: 'top'})));
      if (!ranges.length) continue;
      const marker = term.registerMarker(y - buffer.baseY - buffer.cursorY);
      if (!marker) continue;
      const decorations = [];
      for (const range of ranges) {
        const x = range.cellX ?? columns[range.start];
        const width = range.cellWidth ?? (ends[range.end - 1] - x);
        const decoration = term.registerDecoration({marker, x, width,
          foregroundColor: range.color, backgroundColor: range.backgroundColor,
          layer: range.layer || 'bottom'});
        if (decoration) decorations.push(decoration);
      }
      decorated.set(y, {text: signature, marker, decorations});
    }
    for (const [y, entry] of decorated) if (!visible.has(y)) { dispose(entry); decorated.delete(y); }
  }
  function schedule() { if (!pending) { pending = true; requestAnimationFrame(paint); } }
  button.onclick = () => { enabled = !enabled; localStorage.setItem("midflight-text-colors", enabled ? "on" : "off"); label(); schedule(); };
  term.onWriteParsed(schedule); term.onResize(schedule); term.onScroll(schedule);
  schedule();
  return next => {
    if (JSON.stringify(layout) === JSON.stringify(next || {})) return;
    layout = next || {};
    for (const entry of decorated.values()) dispose(entry);
    decorated.clear(); schedule();
  };
}

// Shared tmux panes have one size: only the foreground browser may set it.
function installTerminalSizing(term, fit, socket) {
  let scheduled=false, ownsSize=document.hasFocus();
  function resize() {
    scheduled=false;
    if(document.visibilityState!=='visible'||!ownsSize)return;
    const box=document.getElementById('terminal').getBoundingClientRect();
    if(box.width<1||box.height<1)return;
    fit.fit();
    const ws=socket();
    if(ws?.readyState===1)ws.send(JSON.stringify({type:'resize',cols:term.cols,rows:term.rows}));
  }
  function schedule(){if(!scheduled){scheduled=true;requestAnimationFrame(resize)}}
  window.addEventListener('resize',schedule);
  function activate(){ownsSize=true;schedule()}
  window.addEventListener('focus',activate);
  window.addEventListener('blur',()=>{ownsSize=false});
  document.addEventListener('pointerdown',activate);
  document.addEventListener('visibilitychange',()=>{ownsSize=document.hasFocus();schedule()});
  const observer=new ResizeObserver(schedule);
  observer.observe(document.getElementById('terminal'));
  return schedule;
}

(async()=>{let connection,ws,generation=0,session=null,seenDirection=null,resetting=false;const note=document.getElementById('note'),button=document.getElementById('reset');const term=new Terminal({fontSize:12,fontFamily:'Menlo,monospace',cursorBlink:true,allowProposedApi:true,theme:{background:'#101114'}});const fit=new FitAddon.FitAddon();term.loadAddon(fit);term.open(document.getElementById('terminal'));fit.fit();const updateColorLayout=installDemoTextColors(term,document.getElementById('colors'));term.onData(data=>{if(ws?.readyState===1)ws.send(JSON.stringify({type:'input',data}))});const resize=installTerminalSizing(term,fit,()=>ws);
const fullscreen=document.getElementById('fullscreen');fullscreen.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){fullscreen.title='Fullscreen is unavailable here. Use Control–Command–F in Chrome on macOS, or open this URL in your browser.';note.textContent=fullscreen.title}};document.addEventListener('fullscreenchange',()=>{fullscreen.textContent=document.fullscreenElement?'Exit fullscreen':'Fullscreen';requestAnimationFrame(resize)});

async function connect(){const current=++generation;try{connection=await(await fetch('/connection')).json();if(current!==generation)return;if(session!==connection.session){term.reset();session=connection.session;seenDirection=null}ws=new WebSocket('ws://'+location.host+'/terminal?key='+encodeURIComponent(connection.key));ws.binaryType='arraybuffer';ws.onopen=()=>{resize();term.focus()};ws.onmessage=e=>{if(current===generation)term.write(new Uint8Array(e.data))};ws.onclose=()=>{if(current===generation&&!resetting)setTimeout(connect,1500)}}catch(e){if(current===generation&&!resetting)setTimeout(connect,1500)}}
async function status(){if(!connection||resetting)return;try{const r=await fetch('/status',{headers:{'X-Demo-Key':connection.key}});if(!r.ok)return;const s=await r.json();updateColorLayout(s.layout);note.textContent='';}catch(e){note.textContent='Reconnecting…'}}
button.onclick=async()=>{if(resetting||!connection)return;resetting=true;button.disabled=true;button.textContent='Resetting…';note.textContent='Starting a fresh team; prior evidence is retained';try{const r=await fetch('/reset',{method:'POST',headers:{'X-Demo-Key':connection.key}});if(!r.ok)throw Error((await r.json()).detail);generation++;ws?.close();term.reset();resetting=false;await connect()}catch(e){note.textContent=e.message;resetting=false}finally{button.disabled=false;button.textContent='Reset'}};await connect();setInterval(status,750);status();})();
</script></html>
