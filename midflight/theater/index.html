<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MidFlight · Four agents</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1018;color:#e7edf7;font:15px system-ui}header{padding:20px 28px;border-bottom:1px solid #2b3343;display:flex;align-items:center;gap:18px}h1{font-size:21px;margin:0}small{color:#96a7bd}button,a{background:#c5f576;color:#17200e;padding:10px 15px;border:0;border-radius:7px;font-weight:650;text-decoration:none;cursor:pointer}button:disabled{opacity:.4;cursor:default}.secondary{background:#243046;color:#e7edf7}#meta{margin-left:auto}main{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;padding:18px;height:calc(100vh - 145px)}article{background:#131b29;border:1px solid #303d51;border-radius:12px;display:flex;flex-direction:column;min-height:0}h2{margin:0;font-size:17px;padding:14px 18px;border-bottom:1px solid #303d51;display:flex;justify-content:space-between}pre{white-space:pre-wrap;overflow:auto;font:13px/1.5 ui-monospace,monospace;padding:16px;margin:0;flex:1;color:#ccd9ea}.badge{font-size:12px;color:#c5f576}footer{padding:0 28px;color:#a2b2c8;font-size:13px}#error{color:#ffa6a6;margin-left:12px}@media(max-width:750px){main{grid-template-columns:1fr;height:auto}article{height:400px}header{flex-wrap:wrap}}
</style><header><div><h1>MidFlight / live collaboration</h1><small>Four real agents · one shared project</small></div><button id="build" onclick="run('build')">1. Start agents</button><button id="change" class="secondary" onclick="run('change')" disabled>2. Introduce pricing change</button><a class="secondary" href="/report" target="_blank">Run evidence</a><button id="fresh" class="secondary" onclick="fresh()">New run</button><small id="meta"></small></header><main id="grid"></main><footer>Pricing → Checkout → Reporting · Notifications is independent. Downstream reporting propagation is pending graph integration.<span id="error"></span></footer><script>
const names=['pricing','checkout','reporting','notifications'];for(const n of names){const a=document.createElement('article');a.innerHTML='<h2>'+n[0].toUpperCase()+n.slice(1)+'<span class="badge" id="s-'+n+'">ready</span></h2><pre id="l-'+n+'">Waiting to start…</pre>';document.querySelector('#grid').append(a)}
async function run(phase){try{const r=await fetch('/run/'+phase,{method:'POST'});if(!r.ok)throw Error((await r.json()).detail);document.querySelector('#error').textContent='';await poll()}catch(e){document.querySelector('#error').textContent=e.message}}
async function fresh(){try{const r=await fetch("/new",{method:"POST"});if(!r.ok)throw Error((await r.json()).detail);await poll()}catch(e){document.querySelector("#error").textContent=e.message}}
async function poll(){try{const s=await(await fetch('/state')).json();document.querySelector('#meta').textContent=s.commit+(s.dirty?' · modified checkout':'')+' · '+s.phase;document.querySelector('#fresh').disabled=s.busy;document.querySelector('#build').disabled=s.busy||s.phase!=='ready';document.querySelector('#change').disabled=s.busy||s.phase!=='built';for(const n of names){document.getElementById('s-'+n).textContent=s.agents[n].status;const p=document.getElementById('l-'+n),t=s.agents[n].events.join('\n\n');if(p.textContent!==(t||'Waiting to start…')){const bottom=p.scrollHeight-p.scrollTop-p.clientHeight<70;p.textContent=t||'Waiting to start…';if(bottom)p.scrollTop=p.scrollHeight}}}catch(e){document.querySelector('#error').textContent='Reconnecting to demo…'}}setInterval(poll,1000);poll();
</script></html>
