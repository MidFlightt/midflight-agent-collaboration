<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MidFlight · project</title><style>
*{box-sizing:border-box}body{margin:0;background:#090f14;color:#f0eee7;font:11px/1.5 ui-monospace,Menlo,monospace}header{display:flex;align-items:center;gap:12px;border-bottom:1px solid #263541;padding:10px 14px}header b{font-weight:500;color:#80cadf}#status{margin-left:auto;color:#9fabb7;font-size:10px}a,button{font:inherit;border:0;background:transparent;color:#9fabb7;cursor:pointer;text-decoration:none}#direction{margin:0;padding:8px 14px;color:#f3b183;border-bottom:1px solid #263541;font-size:10px}#direction:empty{display:none}#board{position:relative;min-height:290px;padding:24px 18px;display:grid;grid-template-columns:1fr 1fr;gap:44px 54px}#edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.card{position:relative;z-index:1;background:#121922;border:1px solid #30434e;border-radius:5px;padding:10px 12px;min-width:0;cursor:pointer}.card.flash{animation:new 1.6s ease-out}.name{font-weight:600;font-size:12px;color:#80cadf}.state{font-size:9px;color:#9fabb7;display:block;margin-top:2px}.branch{display:block;margin:6px 0;color:#9fabb7;font-size:9px;overflow-wrap:anywhere}.task{font-size:10px;color:#9fabb7;margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.files{border-top:1px solid #263541;padding-top:6px}.files span{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d0d9df}.files small{display:block;font-size:8px;text-transform:uppercase;color:#718290;margin-bottom:3px}.pending{border-color:#f3b183}.pending .state{color:#f3b183}.ready .state{color:#a6d3ad}.pulse{stroke-dasharray:5 10;animation:flow 1s linear 2}#activity{border-top:1px solid #263541;padding:8px 14px;color:#9fabb7}#activity h2{font:inherit;font-size:9px;color:#718290;letter-spacing:.1em;margin:0 0 5px}#events{list-style:none;padding:0;margin:0;max-height:105px;overflow:auto}#events li{font-size:10px;padding:3px 0;animation:appear .5s ease-out}#events time{color:#718290;margin-right:8px}#toast{position:fixed;bottom:14px;left:14px;right:14px;background:#182a35;border:1px solid #80cadf55;border-radius:4px;padding:8px 12px;color:#bfeaf5;font-size:10px;pointer-events:none;z-index:3}#toast:empty{display:none}#detail{position:fixed;z-index:4;bottom:20px;left:20px;right:20px;max-height:65vh;overflow:auto;background:#121922;border:1px solid #30434e;padding:16px;border-top:1px solid #263541;white-space:pre-wrap;color:#9fabb7;font-size:10px}footer{padding:8px 14px;color:#718290;font-size:9px}#empty{grid-column:1/-1;text-align:center;color:#718290;padding:60px 0}@keyframes new{from{border-color:#80cadf;box-shadow:0 0 12px #80cadf55}to{box-shadow:none}}@keyframes flow{to{stroke-dashoffset:-30}}@keyframes appear{from{opacity:0}to{opacity:1}}@media(min-width:900px){#board{max-width:1000px;margin:auto;gap:70px 160px;padding:50px}header,#direction,#activity,#detail,footer{padding-left:max(18px,calc((100vw - 1000px)/2))}}@media(max-width:360px){#board{gap:30px 20px;padding:18px 10px}.card{padding:7px}header{padding:8px 10px}.files span{font-size:9px}}
</style><header><b>midflight / project</b><a href="/graph" target="_blank">Graph ↗</a><span id="status" role="status">Connecting…</span></header><p id="direction"></p><main id="board"><svg id="edges" aria-hidden="true"></svg><div id="empty">Waiting for agents to connect.</div></main><section id="activity"><h2>ACTIVITY · OBSERVED LIVE</h2><ul id="events"></ul></section><div id="detail" hidden></div><footer>FalkorDB coordination · Files shown are declared scope</footer><div id="toast" role="status"></div><script>
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
let key='',project='',baseline=false,polling=false,selected=null,toastTimer,latest;
const cards=new Map(),known=new Map(),slots=new Map();
function event(text,agent){const item=document.createElement('li'),time=document.createElement('time');time.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});item.append(time,document.createTextNode(text));$('events').prepend(item);while($('events').children.length>25)$('events').lastChild.remove();$('toast').textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',3500);const card=cards.get(agent);if(card){card.classList.remove('flash');void card.offsetWidth;card.classList.add('flash')}}
function observed(id,value,text,agent){if(known.has(id)&&known.get(id)!==value&&baseline)event(text,agent);else if(!known.has(id)&&baseline)event(text,agent);known.set(id,value)}
function show(name){selected=name;const a=latest.agents.find(a=>a.id===name);if(!a)return;$('detail').hidden=false;$('detail').textContent=a.name+'\n'+a.claims.map(c=>`${c.id} r${c.revision} · ${c.state} · plan ${c.plan_version}\n${c.acceptance_criteria.join('\n')}`).join('\n\n')+'\n\n'+a.updates.map(d=>d.state+': '+d.requested_adjustment).join('\n')}
function derive(raw,report){
 const owners=new Map(raw.edges.filter(e=>e.kind==='claims').map(e=>[e.target,e.source]));
 const agents=raw.nodes.filter(n=>n.kind==='agent').map(n=>{const name=n.label,claims=(report.claims||[]).filter(c=>c.agent_id===name);const files=[...new Set(claims.flatMap(c=>c.files))];const updates=(report.directives||[]).filter(d=>d.recipient_id===name&&d.plan_version===raw.plan_version&&d.state!=='superseded');const pending=updates.some(d=>['queued','delivered','needs_clarification','rejected'].includes(d.state));return {id:n.id,name,claims,files,updates,branch:claims.at(-1)?.branch||null,state:report.agents?.[name]?.alive===false?'Session ended':pending?'Update needs attention':updates.length&&updates.every(d=>d.state==='acknowledged')?'Change acknowledged':claims.length&&claims.every(c=>c.state==='approved')?'Scope approved':claims.length?'Claim '+claims.at(-1).state:'Connected · no claim yet',pending,ready:!pending&&claims.length&&claims.every(c=>c.state==='approved')}});
 const edges=new Map();for(const p of raw.edges.filter(e=>e.kind==='provides'))for(const c of raw.edges.filter(e=>e.kind==='consumes')){const a=owners.get(p.source),b=owners.get(c.source);if(p.target===c.target&&a&&b&&a!==b)edges.set(a+'|'+b,{source:a,target:b})}return {agents,edges:[...edges.values()]};
}
function lines(edges,animate=false){const board=$('board').getBoundingClientRect();$('edges').replaceChildren();const defs=document.createElementNS(NS,'defs'),marker=document.createElementNS(NS,'marker');for(const [k,v] of Object.entries({id:'arrow',viewBox:'0 0 10 10',refX:'9',refY:'5',markerWidth:'5',markerHeight:'5',orient:'auto'}))marker.setAttribute(k,v);const head=document.createElementNS(NS,'path');head.setAttribute('d','M0 0L10 5L0 10');head.setAttribute('fill','#80cadf');marker.append(head);defs.append(marker);$('edges').append(defs);for(const e of edges){const a=cards.get(e.source)?.getBoundingClientRect(),b=cards.get(e.target)?.getBoundingClientRect();if(!a||!b)continue;const dx=b.x-a.x,dy=b.y-a.y,vertical=Math.abs(dy)>Math.abs(dx);let x1,y1,x2,y2;if(vertical){x1=a.x+a.width/2-board.x;y1=(dy>0?a.bottom:a.top)-board.y;x2=b.x+b.width/2-board.x;y2=(dy>0?b.top:b.bottom)-board.y}else{x1=(dx>0?a.right:a.left)-board.x;y1=a.y+a.height/2-board.y;x2=(dx>0?b.left:b.right)-board.x;y2=b.y+b.height/2-board.y}const path=document.createElementNS(NS,'path');path.setAttribute('d',`M${x1} ${y1} C${(x1+x2)/2} ${y1},${(x1+x2)/2} ${y2},${x2} ${y2}`);path.setAttribute('stroke','#80cadf88');path.setAttribute('fill','none');path.setAttribute('stroke-width','1.3');path.setAttribute('marker-end','url(#arrow)');if(animate)path.classList.add('pulse');$('edges').append(path)}}
function draw(raw,report){
 if(project!==raw.project){project=raw.project;baseline=false;known.clear();slots.clear();for(const c of cards.values())c.remove();cards.clear();$('events').replaceChildren();$('detail').hidden=true;selected=null}
 const data=derive(raw,report);latest=data;$('empty').hidden=data.agents.length>0;
 let changed=false;
 for(const a of data.agents){if(!cards.has(a.id)){const card=document.createElement('article');card.className='card';card.innerHTML='<div class="name"></div><span class="state"></span><span class="branch"></span><div class="task"></div><div class="files"></div>';card.onclick=()=>{if(selected===a.id&&!$('detail').hidden){selected=null;$('detail').hidden=true}else show(a.id)};cards.set(a.id,card);$('board').append(card);changed=true}const card=cards.get(a.id);card.classList.toggle('pending',a.pending);card.classList.toggle('ready',!!a.ready);card.querySelector('.name').textContent=a.name;card.querySelector('.state').textContent=a.state;card.querySelector('.branch').title='Branch declared in the latest claim';card.querySelector('.branch').textContent='⑂ '+(a.branch||'branch not declared yet');const task=card.querySelector('.task');task.textContent=a.claims.at(-1)?.acceptance_criteria?.[0]||'Waiting for declared scope';task.title=task.textContent;const files=card.querySelector('.files');files.replaceChildren();const label=document.createElement('small');label.textContent='Declared files';files.append(label);for(const f of a.files.slice(0,3)){const row=document.createElement('span');row.textContent='› '+f;row.title=f;files.append(row)}if(a.files.length>3){const more=document.createElement('small');more.textContent=`+ ${a.files.length-3} more`;files.append(more)}observed('agent:'+a.id,'connected',a.name+' connected',a.id);for(const c of a.claims){const id='claim:'+c.id,val=c.revision+':'+c.state;if(known.get(id)!==val)changed=true;observed(id,val,a.name+' · '+c.id+' r'+c.revision+' '+c.state,a.id)}for(const f of a.files)observed('file:'+a.id+':'+f,'declared',a.name+' declared '+f,a.id);for(const d of a.updates){if(known.get('directive:'+d.id)!==d.state)changed=true;observed('directive:'+d.id,d.state,a.name+' · update '+d.state,a.id)}}
 observed('plan',raw.plan_version,'Shared plan updated to v'+raw.plan_version);$('status').textContent='plan '+raw.plan_version+' · '+data.agents.length+' agents';$('direction').textContent=report.human_direction||'';lines(data.edges,baseline&&changed);if(!baseline){const item=document.createElement('li');item.textContent='Watching this project. New coordination activity appears here.';$('events').append(item)}baseline=true;if(selected)show(selected);
}
async function refresh(){if(polling)return;polling=true;try{if(!key)key=(await(await fetch('/connection')).json()).key;const r=await fetch('/graph-state',{headers:{'x-demo-key':key}});if(r.status===403){key='';return}if(!r.ok)throw Error();const [raw,report]=await Promise.all([r.json(),fetch('/report').then(r=>r.json())]);if(raw.project===report.project)draw(raw,report)}catch(e){$('status').textContent='Waiting for live service…'}finally{polling=false}}
addEventListener('resize',()=>{if(latest)lines(latest.edges)});refresh();setInterval(refresh,1800);
</script></html>
