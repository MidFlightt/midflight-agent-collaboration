<!doctype html><html lang="en"><meta charset="utf-8"><title>MidFlight · interactive coding terminals</title><link rel="stylesheet" href="/vendor/xterm.css"><style>html,body{margin:0;height:100%;background:#101114;color:#ddd;font:13px system-ui}header{height:42px;display:flex;align-items:center;gap:18px;padding:0 15px}button,a{background:#273041;color:#eee;border:0;border-radius:4px;padding:6px 10px;cursor:pointer;text-decoration:none}#terminal{height:calc(100% - 42px);padding:0 8px}#note{margin-left:auto;font-size:12px;color:#b6c8a6}</style><header><b>MidFlight · four live Codex terminals</b><button id="change">Introduce plan change</button><a href="/report" target="_blank">Test evidence</a><span id="note">Connecting…</span></header><div id="terminal"></div><script src="/vendor/xterm.js"></script><script src="/vendor/addon-fit.js"></script><script>
(async()=>{const connection=await(await fetch('/connection')).json();let ws;const term=new Terminal({fontSize:12,fontFamily:'Menlo,monospace',cursorBlink:true,theme:{background:'#101114'},allowProposedApi:false});const fit=new FitAddon.FitAddon();term.loadAddon(fit);term.open(document.getElementById('terminal'));fit.fit();term.onData(data=>{if(ws?.readyState===1)ws.send(JSON.stringify({type:'input',data}))});function resize(){fit.fit();if(ws?.readyState===1)ws.send(JSON.stringify({type:'resize',cols:term.cols,rows:term.rows}))}window.addEventListener('resize',resize);function connect(){ws=new WebSocket('ws://'+location.host+'/terminal?key='+encodeURIComponent(connection.key));ws.binaryType='arraybuffer';ws.onopen=()=>{resize();term.focus();document.getElementById('note').textContent=connection.commit+' · same sessions across stages'};ws.onmessage=e=>term.write(new Uint8Array(e.data));ws.onclose=()=>{document.getElementById('note').textContent='Reconnecting to your sessions…';setTimeout(connect,1500)}}connect();document.getElementById('change').onclick=async()=>{const r=await fetch('/change',{method:'POST',headers:{'X-Demo-Key':connection.key}});document.getElementById('note').textContent=r.ok?'One change introduced · same four sessions':(await r.json()).detail;term.focus()};})();
</script></html>
