async function startResults(){
const template=document.getElementById('results-view');document.body.className='results';document.body.replaceChildren(template.content.cloneNode(true));document.title='MidFlight · team test results';
const el=id=>document.getElementById(id),names=['pricing','checkout','reporting','notifications'];let busy=false;
const title=s=>s.charAt(0).toUpperCase()+s.slice(1);
function text(id,value,cls){el(id).textContent=value;if(cls!==undefined)el(id).className=cls}
function item(parent,message,cls){const li=document.createElement('li');li.textContent=message;if(cls)li.className=cls;parent.append(li)}
async function refresh(){if(busy)return;busy=true;el('refresh-results').disabled=true;try{
const response=await fetch('/report',{cache:'no-store'});if(!response.ok)throw Error('Report unavailable');const r=await response.json();const checks=r.checks||{},claims=r.claims||[],directives=r.directives||[],changed=r.phase==='changed',peer=r.mode==='peer-experiment';
const latest=names.map(name=>claims.filter(c=>c.task_id===name).sort((a,b)=>b.revision-a.revision)[0]);
const approved=latest.filter(c=>c?.state==='approved').length;
const basic=['four_claims','all_claims_approved','application_integration','sessions_alive'];const pivot=['subscription_tasks_notified','notifications_unaffected'];
const required=peer?['four_claims','all_claims_approved','sessions_alive']:(changed?[...basic,...pivot]:basic);const notified=directives.filter(d=>['pricing','checkout','reporting'].includes(d.task_id));
const acknowledged=peer?directives.every(d=>d.state==='acknowledged'||d.state==='superseded'):!changed||['pricing','checkout','reporting'].every(n=>notified.some(d=>d.task_id===n)&&notified.filter(d=>d.task_id===n).every(d=>d.state==='acknowledged'));
const passed=required.every(k=>checks[k]===true)&&Object.values(checks).every(v=>v===true)&&acknowledged;
text('verdict',peer?(passed?'Peer coordination checks passed. Code acceptance has not been independently assessed.':'Peer coordination is still in progress. See claims and directives below.'):passed?(changed?'Subscription change verified: the affected agents acknowledged it and their code works together.':'Initial build verified. The four agents are ready for your direction.'):'Some checks are not yet passing. Read the agent statuses and checks below; agents may still be working.',passed?'good':'pending');
text('plan-summary',peer?'Shared plan v'+r.plan_version:changed?'Subscription billing':'Initial build');text('plan-detail',peer?'Every peer can publish a human-requested update.':changed?'Monthly pricing, subscription orders, monthly reporting.':'No product change has been introduced.');text('claims-summary',approved+' / 4 approved',approved===4?'metric good':'metric pending');text('integration-summary',peer?'Not assessed':r.integration?.passed?'Passed':'Not passing',r.integration?.passed?'metric good':'metric pending');
text('direction-summary',peer?'Give a direction in any coding window. The affected set comes from the submitted plan and dependencies.':changed?'Pricing, Checkout and Reporting are affected. Notifications has no dependency on the changed contracts.':'Type your product direction in Pricing / Lead when you are ready. Agents already have their initial task assignments.');
el('human-direction').hidden=!r.human_direction;text('human-direction',r.human_direction||'');
el('agent-results').replaceChildren();for(const [i,name] of names.entries()){const tr=document.createElement('tr'),claim=latest[i],ds=directives.filter(d=>d.task_id===name);const values=[title(name)+(name==='pricing'?' / Lead':''),r.agents?.[name]?.alive?'Alive':'Not running',claim?title(claim.state.replaceAll('_',' '))+' · revision '+claim.revision+' · plan '+claim.plan_version:'No claim yet',ds.length?(ds.every(d=>d.state==='acknowledged')?'Acknowledged':ds.length+' directive(s), awaiting acknowledgement'):(changed?'No directive'+(!peer&&name==='notifications'?' · unaffected':''):'No change introduced')];for(const value of values){const td=document.createElement('td');td.textContent=value;tr.append(td)}el('agent-results').append(tr)}
const labels={four_claims:'All four agents submitted a claim',all_claims_approved:'All saved claims are approved',application_integration:'Generated code passes the independent integration test',sessions_alive:'All four coding sessions are alive',pricing_and_checkout_notified:'Pricing and Checkout received directives',subscription_tasks_notified:'Pricing, Checkout and Reporting received directives',notifications_unaffected:'Notifications received no directive',unaffected_code_preserved:'Notifications code matches its pre-change snapshot'};
el('acceptance-checks').replaceChildren();for(const [key,value] of Object.entries(checks))item(el('acceptance-checks'),(value?'Passed — ':'Not passing — ')+(labels[key]||key.replaceAll('_',' ')),value?'good':'pending');if(changed&&!peer){item(el('acceptance-checks'),(acknowledged?'Passed — ':'Waiting — ')+'All three affected agents acknowledged their directives',acknowledged?'good':'pending');if(!('unaffected_code_preserved'in checks))item(el('acceptance-checks'),'Not measured — Notifications had no pre-change code snapshot to compare.','pending')}
text('integration-output',r.integration?.output||'No test output yet.');
el('event-timeline').replaceChildren();const seen={};for(const event of r.visual_events||[]){if(event.type==='direction_accepted'){item(el('event-timeline'),new Date(event.time).toLocaleTimeString()+' · Lead direction accepted');continue}if(event.cue==='unchanged'||seen[event.agent]===event.cue)continue;seen[event.agent]=event.cue;item(el('event-timeline'),new Date(event.time).toLocaleTimeString()+' · '+title(event.agent)+' · '+(event.cue==='acknowledged'?'Acknowledgement observed':'Change received at check-in'))}if(!el('event-timeline').children.length)item(el('event-timeline'),'No direction-change events yet.');
text('run-details','Project: '+r.project+'\nSession: '+r.session+'\nBackend commit: '+r.commit+'\nUncommitted changes at startup: '+(r.dirty?'yes':'no')+'\nReport generated: '+r.time);text('refresh-state','Updated '+new Date(r.time).toLocaleTimeString(),'muted');
}catch(error){text('refresh-state','Could not refresh. Retry when the local service is available.','error')}finally{busy=false;el('refresh-results').disabled=false}}
el('refresh-results').onclick=refresh;await refresh();setInterval(()=>{if(!document.hidden)refresh()},5000);
}

<script src="/vendor/xterm.js"></script><script src="/vendor/addon-fit.js"></script><script>
// BEGIN DEMO TEXT COLORS — presentation only; never edits the terminal stream.
function demoColorRanges(text) {
  const rules = [
    ['#79bdff', /\btheater_midflight\.(?:check_in|set_direction|submit_claim|acknowledge_directive|read_shared_plan|publish_shared_plan)\b/g],
    ['#7cdae7', /\bplan\s+v?\d+\b/gi],
    ['#f7ba55', /\b(?:We will do subscription based|subscription-billing|subscription_id|billing_interval|monthly|cancellation-policy|refund_cents|four.credit|cancellation fee)\b/gi],
    ['#c4aaff', /\b(?:D-\d+|directives?|needs_revision|needs revision)\b/gi],
    ['#65d8ac', /\b(?:APPROVED|approved|ACKNOWLEDGED|[Aa]cknowledged|PASS(?:ED)?|[Pp]assed|[Tt]ests? passed)\b/g],
    ['#9499a3', /\b(?:No changes since your last check-in|Requirements and contracts: unchanged|unchanged since the check-in you named|no (?:findings|open directives)|unaffected|preserved)\b/gi],
    ['#ff8d91', /\b(?:BLOCKED|[Bb]locked|REJECTED|[Rr]ejected|CONFLICT|[Cc]onflict|FAILED|[Ff]ailed|ERROR|Error)\b/g],
  ];
  const cells = Array(text.length).fill(null);
  for (const [color, pattern] of rules) {
    for (const match of text.matchAll(pattern)) cells.fill(color, match.index, match.index + match[0].length);
  }
  const ranges = [];
  for (let start = 0; start < cells.length;) {
    let end = start + 1;
    while (end < cells.length && cells[end] === cells[start]) end++;
    if (cells[start]) ranges.push({start, end, color: cells[start]});
    start = end;
  }
  return ranges;
}
// END DEMO TEXT COLORS
function installDemoTextColors(term) {
  let pending = false, previousBuffer, previousCols;
  const decorated = new Map();
  function dispose(entry) { for (const decoration of entry.decorations) decoration.dispose(); entry.marker.dispose(); }
  function paint() {
    pending = false;
    const buffer = term.buffer.active;
    if (buffer !== previousBuffer || term.cols !== previousCols) {
      for (const entry of decorated.values()) dispose(entry);
      decorated.clear(); previousBuffer = buffer; previousCols = term.cols;
    }
    const visible = new Set();
    for (let row = 0; row < term.rows; row++) {
      const y = buffer.viewportY + row, line = buffer.getLine(y);
      if (!line) continue;
      visible.add(y);
      let text = ''; const columns = [], ends = [];
      for (let x = 0; x < line.length; x++) {
        const cell = line.getCell(x); if (!cell || cell.getWidth() === 0) continue;
        const chars = cell.getChars() || ' ';
        for (let i = 0; i < chars.length; i++) { columns.push(x); ends.push(x + cell.getWidth()); }
        text += chars;
      }
      const old = decorated.get(y);
      if (old?.text === text && !old.marker.isDisposed && old.marker.line === y) continue;
      if (old) { dispose(old); decorated.delete(y); }
      const ranges = demoColorRanges(text); if (!ranges.length) continue;
      const marker = term.registerMarker(y - buffer.baseY - buffer.cursorY);
      if (!marker) continue;
      const decorations = [];
      for (const range of ranges) {
        const x = columns[range.start], width = ends[range.end - 1] - x;
        const decoration = term.registerDecoration({marker, x, width, foregroundColor: range.color, layer: 'bottom'});
        if (decoration) decorations.push(decoration);
      }
      decorated.set(y, {text, marker, decorations});
    }
    for (const [y, entry] of decorated) if (!visible.has(y)) { dispose(entry); decorated.delete(y); }
  }
  function schedule() { if (!pending) { pending = true; requestAnimationFrame(paint); } }
  term.onWriteParsed(schedule); term.onResize(schedule); term.onScroll(schedule);
  schedule();
}

// Claim badges use structured backend verdicts, never words in an agent transcript.
function installClaimBadges(term) {
  const host=document.getElementById('claim-badges'), panel=document.getElementById('claim-detail');
  const labels={ready:'NO CLAIM',pending:'REVIEWING',approved:'APPROVED',needs_revision:'NEEDS REVISION',human_review_required:'HUMAN REVIEW',draft:'INCOMPLETE CLAIM',closed:'CLOSED',withdrawn:'WITHDRAWN'};
  let selected=null, lastStatus=null;
  function add(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;panel.append(e);return e}
  function details(name,data,button){
    panel.hidden=false;const detailKey=JSON.stringify({name,data});
    if(panel.dataset.key!==detailKey){panel.dataset.key=detailKey;panel.replaceChildren();
    const close=add('button','Close ×');close.onclick=()=>{selected=null;panel.hidden=true;button.setAttribute('aria-expanded','false');button.focus()};
    add('h2',name+' / '+(labels[data.state]||data.state));
    add('p',data.claim_id?data.claim_id+' · revision '+data.revision+' · plan v'+data.plan_version:'No claim submitted yet.','muted');
    if(data.state==='approved')add('p','Declared plan and interfaces approved. This does not mean implementation or tests have passed.');
    else if(data.state==='pending')add('p','MidFlight is reviewing the submitted claim. Approval is still pending.');
    for(const f of data.findings||[]){add('p',f.explanation);if(f.proposed_correction)add('p','Fix: '+f.proposed_correction)}
    const earlier=(data.history||[]).filter(h=>h.revision!==data.revision);
    if(earlier.length){add('p','Earlier revisions','muted');for(const h of earlier){add('p','r'+h.revision+' · '+(labels[h.state]||h.state));for(const f of h.findings||[])add('p',f.explanation,'muted')}}
    }
    const r=button.getBoundingClientRect();panel.style.left=Math.max(8,Math.min(r.right-390,innerWidth-400))+'px';panel.style.top=Math.min(r.bottom+6,innerHeight-panel.offsetHeight-8)+'px';
  }
  function paint(status){
    lastStatus=status;const screen=document.querySelector('#terminal .xterm-screen');if(!screen)return;
    const box=screen.getBoundingClientRect(),cw=box.width/term.cols,ch=box.height/term.rows;
    const active=new Set();
    for(const [name,geometry] of Object.entries(status.layout||{})){
      const data=status.claim_statuses?.[name];if(!data)continue;active.add(name);
      let button=Array.from(host.children).find(e=>e.dataset.agent===name);
      if(!button){button=document.createElement('button');button.className='claim-badge';button.dataset.agent=name;host.append(button)}
      button.dataset.state=data.state;button.replaceChildren(document.createTextNode(labels[data.state]||data.state));
      if(data.claim_id){const meta=document.createElement('small');meta.textContent=' · '+data.claim_id+' r'+data.revision;button.append(meta)}
      const previous=(data.history||[]).filter(h=>h.revision<data.revision&&h.state==='needs_revision');
      button.title=name+': '+(labels[data.state]||data.state)+(previous.length?' (previous revision needed correction)':'')+'. Click for why and the suggested fix.';
      button.setAttribute('aria-label',button.title);button.setAttribute('aria-expanded',String(selected===name&&!panel.hidden));
      button.style.left=(box.left+(geometry.x+geometry.width)*cw-4)+'px';button.style.top=(box.top+Math.max(0,geometry.y-1)*ch)+'px';button.style.transform='translateX(-100%)';button.style.maxWidth=(geometry.width*cw*.78)+'px';button.style.height=ch+'px';
      button.onclick=()=>{if(selected===name&&!panel.hidden){selected=null;panel.hidden=true}else{selected=name;details(name,data,button)}button.setAttribute('aria-expanded',String(selected===name&&!panel.hidden))};
      if(selected===name&&!panel.hidden)details(name,data,button);
    }
    for(const e of Array.from(host.children))if(!active.has(e.dataset.agent))e.remove();
  }
  document.addEventListener('pointerdown',e=>{if(!panel.contains(e.target)&&!host.contains(e.target)){selected=null;panel.hidden=true}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!panel.hidden){e.preventDefault();e.stopPropagation();selected=null;panel.hidden=true}},true);
  window.addEventListener('resize',()=>{if(lastStatus)paint(lastStatus)});
  return {paint,clear(){host.replaceChildren();panel.hidden=true;delete panel.dataset.key;selected=null;lastStatus=null}};
}
(async()=>{if(new URLSearchParams(location.search).get("view")==="results"){await startResults();return}let connection,ws,generation=0,session=null,seenDirection=null,resetting=false;const note=document.getElementById('note'),button=document.getElementById('reset');const term=new Terminal({fontSize:12,fontFamily:'Menlo,monospace',cursorBlink:true,allowProposedApi:true,theme:{background:'#101114'}});const fit=new FitAddon.FitAddon();term.loadAddon(fit);term.open(document.getElementById('terminal'));const claimBadges=installClaimBadges(term);installDemoTextColors(term);fit.fit();term.onData(data=>{if(ws?.readyState===1)ws.send(JSON.stringify({type:'input',data}))});function resize(){fit.fit();if(ws?.readyState===1)ws.send(JSON.stringify({type:'resize',cols:term.cols,rows:term.rows}))}window.addEventListener('resize',resize);
const fullscreen=document.getElementById('fullscreen');fullscreen.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){fullscreen.title='Fullscreen is unavailable here. Use Control–Command–F in Chrome on macOS, or open this URL in your browser.';note.textContent=fullscreen.title}};document.addEventListener('fullscreenchange',()=>{fullscreen.textContent=document.fullscreenElement?'Exit fullscreen':'Fullscreen';requestAnimationFrame(resize)});

async function connect(){const current=++generation;try{connection=await(await fetch('/connection')).json();if(current!==generation)return;if(session!==connection.session){claimBadges.clear();term.reset();session=connection.session;seenDirection=null}ws=new WebSocket('ws://'+location.host+'/terminal?key='+encodeURIComponent(connection.key));ws.binaryType='arraybuffer';ws.onopen=()=>{resize();term.focus()};ws.onmessage=e=>{if(current===generation)term.write(new Uint8Array(e.data))};ws.onclose=()=>{if(current===generation&&!resetting)setTimeout(connect,1500)}}catch(e){if(current===generation&&!resetting)setTimeout(connect,1500)}}
async function status(){if(!connection||resetting)return;try{const r=await fetch('/status',{headers:{'X-Demo-Key':connection.key}});if(!r.ok)return;const s=await r.json();claimBadges.paint(s);note.textContent=s.direction?'Direction accepted · plan '+s.version:'One-off sales · waiting for your direction';}catch(e){note.textContent='Reconnecting…'}}
button.onclick=async()=>{if(resetting||!connection)return;resetting=true;claimBadges.clear();button.disabled=true;button.textContent='Resetting…';note.textContent='Starting a fresh team; prior evidence is retained';try{const r=await fetch('/reset',{method:'POST',headers:{'X-Demo-Key':connection.key}});if(!r.ok)throw Error((await r.json()).detail);generation++;ws?.close();term.reset();resetting=false;await connect()}catch(e){note.textContent=e.message;resetting=false}finally{button.disabled=false;button.textContent='Reset'}};await connect();setInterval(status,750);status();})();
