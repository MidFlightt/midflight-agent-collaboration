<!doctype html><html lang="en"><meta charset="utf-8"><title>MidFlight · live coding team</title><link rel="stylesheet" href="/vendor/xterm.css"><style>
html,body{margin:0;height:100%;background:#101114;color:#ddd;font:13px system-ui}header{height:48px;display:flex;align-items:center;gap:16px;padding:0 15px}button,a{background:#273041;color:#eee;border:0;border-radius:4px;padding:7px 12px;cursor:pointer;text-decoration:none}button:disabled{opacity:.5;cursor:wait}#terminal{height:calc(100% - 48px);padding:0 8px}#note{margin-left:auto;font-size:12px;color:#c4c4cf}#overlays{position:absolute;top:49px;bottom:17px;left:7px;right:9px;pointer-events:none}.cue{position:absolute;box-sizing:border-box;border:2px solid transparent;transition:border-color .25s;}.cue span{position:absolute;right:8px;top:0;padding:2px 5px;font-size:11px;background:#101114;display:none}.cue.direction{border-color:#f7ba55}.cue.direction span{color:#f7ba55;display:block}.cue.received{border-color:#ad8aff}.cue.received span{color:#c4aaff;display:block}.cue.acknowledged{border-color:#65d8ac}.cue.acknowledged span{color:#65d8ac;display:block}body.pivot header{animation:flash 2s ease-out}@keyframes flash{0%{background:#74501a}100%{background:#101114}}small{color:#9c9ca8}
</style><header><b>MidFlight · live coding team</b><small>Type your direction in <strong>Pricing / Lead</strong></small><button id="reset">Reset</button><button id="fullscreen" title="Expand all four coding panes">Fullscreen</button><a href="/report" target="_blank" title="Claims, directives, and independent integration checks">Test results</a><span id="note">Connecting…</span></header><div id="terminal"></div><div id="overlays"><div class="cue" data-agent="pricing"><span></span></div><div class="cue" data-agent="checkout"><span></span></div><div class="cue" data-agent="reporting"><span></span></div><div class="cue" data-agent="notifications"><span></span></div></div><script src="/vendor/xterm.js"></script><script src="/vendor/addon-fit.js"></script><script>
(async()=>{let connection,ws,generation=0,session=null,seenDirection=null,resetting=false;const note=document.getElementById('note'),button=document.getElementById('reset');const term=new Terminal({fontSize:12,fontFamily:'Menlo,monospace',cursorBlink:true,theme:{background:'#101114'}});const fit=new FitAddon.FitAddon();term.loadAddon(fit);term.open(document.getElementById('terminal'));fit.fit();term.onData(data=>{if(ws?.readyState===1)ws.send(JSON.stringify({type:'input',data}))});function resize(){fit.fit();if(ws?.readyState===1)ws.send(JSON.stringify({type:'resize',cols:term.cols,rows:term.rows}))}window.addEventListener('resize',resize);
const fullscreen=document.getElementById('fullscreen');fullscreen.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){fullscreen.title='Fullscreen is unavailable here. Use Control–Command–F in Chrome on macOS, or open this URL in your browser.';note.textContent=fullscreen.title}};document.addEventListener('fullscreenchange',()=>{fullscreen.textContent=document.fullscreenElement?'Exit fullscreen':'Fullscreen';requestAnimationFrame(resize)});

async function connect(){const current=++generation;try{connection=await(await fetch('/connection')).json();if(current!==generation)return;if(session!==connection.session){term.reset();session=connection.session;seenDirection=null}ws=new WebSocket('ws://'+location.host+'/terminal?key='+encodeURIComponent(connection.key));ws.binaryType='arraybuffer';ws.onopen=()=>{resize();term.focus()};ws.onmessage=e=>{if(current===generation)term.write(new Uint8Array(e.data))};ws.onclose=()=>{if(current===generation&&!resetting)setTimeout(connect,1500)}}catch(e){if(current===generation&&!resetting)setTimeout(connect,1500)}}
async function status(){if(!connection||resetting)return;try{const r=await fetch('/status',{headers:{'X-Demo-Key':connection.key}});if(!r.ok)return;const s=await r.json();note.textContent=s.direction?'Direction accepted · plan '+s.version:'One-off sales · waiting for your direction';if(s.direction&&s.direction!==seenDirection){seenDirection=s.direction;document.body.classList.remove('pivot');void document.body.offsetWidth;document.body.classList.add('pivot')}for(const pane of document.querySelectorAll('.cue')){const state=s.cues[pane.dataset.agent];pane.className='cue '+state;const box=s.layout?.[pane.dataset.agent],screen=document.querySelector('.xterm-screen');if(box&&screen){const cw=screen.clientWidth/term.cols,ch=screen.clientHeight/term.rows;Object.assign(pane.style,{left:(box.x*cw)+'px',top:((box.y-1)*ch)+'px',width:(box.width*cw)+'px',height:((box.height+1)*ch)+'px'})}pane.querySelector('span').textContent=state==='direction'?'Direction accepted':state==='received'?'New direction received':state==='acknowledged'?'Update acknowledged':''}}catch(e){note.textContent='Reconnecting…'}}
button.onclick=async()=>{if(resetting||!connection)return;resetting=true;button.disabled=true;button.textContent='Resetting…';note.textContent='Starting a fresh team; prior evidence is retained';try{const r=await fetch('/reset',{method:'POST',headers:{'X-Demo-Key':connection.key}});if(!r.ok)throw Error((await r.json()).detail);generation++;ws?.close();term.reset();for(const pane of document.querySelectorAll('.cue'))pane.className='cue';resetting=false;await connect()}catch(e){note.textContent=e.message;resetting=false}finally{button.disabled=false;button.textContent='Reset'}};await connect();setInterval(status,750);status();})();
</script></html>
