<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MidFlight · live graph</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#090f14;color:#f0eee7;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace}#canvas{position:absolute;inset:0}header{position:fixed;z-index:2;top:20px;left:24px;right:24px;display:flex;align-items:center;gap:20px;pointer-events:none}header b{font-weight:500;letter-spacing:.03em}nav{margin-left:auto;display:flex;gap:14px;align-items:center;pointer-events:auto}button,a{font:inherit;border:0;background:transparent;color:#9fabb7;padding:3px 0;text-decoration:none;cursor:pointer}button:hover,a:hover{color:#80cadf}button:disabled{opacity:.4;cursor:wait}#empty{position:absolute;top:45%;width:100%;text-align:center;pointer-events:none;color:#9fabb7}#empty p{font-size:12px;margin-top:8px}footer{position:fixed;bottom:20px;left:24px;right:24px;display:flex;justify-content:space-between;gap:20px;color:#9fabb7;font-size:11px;pointer-events:none}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:#80cadf}.context{background:#9fabb7}.approved{background:#a6d3ad}.directive{background:#f3b183}#detail{position:fixed;right:24px;bottom:55px;width:min(340px,calc(100vw - 48px));max-height:50vh;overflow:auto;background:#121922f5;padding:18px;border:1px solid #263541;box-shadow:0 5px 25px #00000008}#detail h2{font-size:12px;font-weight:500;margin:0 0 10px}#detail pre{font:11px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#9fabb7}#close{float:right}#status{position:fixed;top:48px;left:24px;font-size:10px;color:#718290;pointer-events:none}@media(max-width:620px){header{top:12px;left:16px;right:16px;gap:10px}nav{gap:10px}footer{left:16px;right:16px;bottom:12px}#source{display:none}#status{left:16px;top:38px}#fit{display:none}}
</style>
<div id="canvas" aria-label="Live hierarchical collaboration graph"></div>
<header><b>midflight</b><nav><button id="start">Start agents</button><button id="reset">Reset</button><button id="fit">Fit</button><button id="full">Fullscreen</button><a href="/" target="_blank">Agents ↗</a></nav></header>
<div id="status" role="status">Connecting…</div><div id="empty">An empty workspace.<p>Start the agents to watch their connections form.</p></div>
<footer><span><i class="dot"></i>agents &nbsp; <i class="dot context"></i>interfaces &nbsp; <i class="dot approved"></i>acknowledged &nbsp; <i class="dot directive"></i>changes</span><span id="source">live · FalkorDB</span></footer>
<aside id="detail" hidden><button id="close" aria-label="Close details">×</button><h2 id="detail-title"></h2><pre id="detail-body"></pre></aside>
<script src="/vendor/force-graph.min.js"></script><script>
const $=id=>document.getElementById(id);
let key='',project='',busy=false,polling=false,signature='',selected=null,hovered=null;
const nodes=new Map(),links=new Map(),lanes=new Map(),rowSlots=new Map();
const color=n=>n.change==='pending'?'#f3b183':n.change==='acknowledged'?'#a6d3ad':n.kind==='agent'?'#80cadf':'#9fabb7';
// Radius grows slowly and is capped, so busy agents remain distinct without dominating.
const radius=n=>n.kind==='agent'?32+Math.min(14,3*Math.sqrt(n.context_count||0)):
 n.kind==='interface'?12+Math.min(10,3*Math.sqrt(n.shared_by||0)):
 n.kind==='directive'?10:n.kind==='claim'?8:7;
function inspect(item){selected=item;$('detail').hidden=!item;if(!item)return;$('detail-title').textContent=item.label||item.kind;
if(item.kind==='agent'){
 $('detail-body').textContent='CLAIMS\n'+(item.claims.map(c=>`${c.label} · ${c.state} · plan ${c.plan_version}`).join('\n')||'No claim yet')+'\n\nDECLARED FILES\n'+(item.files.join('\n')||'None yet')+'\n\nCHANGES\n'+(item.updates.map(d=>`${d.state}: ${d.requested_adjustment}`).join('\n')||'No current directive');return;
}
const copy={};for(const [k,v] of Object.entries(item))if(!['x','y','vx','vy','fx','fy','index','born','__indexColor'].includes(k))copy[k]=(k==='source'||k==='target')&&typeof v==='object'?v.id:v;$('detail-body').textContent=JSON.stringify(copy,null,2)}
const graph=new ForceGraph($('canvas'))
 .width(innerWidth).height(innerHeight).backgroundColor('#090f14')
 .nodeId('id').nodeVal(n=>Math.pow(radius(n)/4,2)).nodeColor(color)
 .nodeLabel(()=>null).linkLabel(()=>null).linkColor(l=>l.change==='pending'?'#f3b183':l.change==='acknowledged'?'#a6d3ad':'#607380')
 .linkWidth(1.4).linkCanvasObjectMode(()=> 'replace').linkCanvasObject((link,ctx,scale)=>{
   const a=link.source,b=link.target;if(typeof a!=='object'||typeof b!=='object')return;
   const dx=b.x-a.x,dy=b.y-a.y,length=Math.hypot(dx,dy)||1,ux=dx/length,uy=dy/length;
   ctx.strokeStyle=link.change==='pending'?'#f3b183':link.change==='acknowledged'?'#a6d3ad':'#607380';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=1.4/scale;
   ctx.beginPath();ctx.moveTo(a.x+ux*radius(a),a.y+uy*radius(a));ctx.lineTo(b.x-ux*radius(b),b.y-uy*radius(b));ctx.stroke();
   const x=a.x+dx*.6,y=a.y+dy*.6,size=6/scale;
   ctx.beginPath();ctx.moveTo(x+ux*size,y+uy*size);ctx.lineTo(x-ux*size-uy*size*.55,y-uy*size+ux*size*.55);ctx.lineTo(x-ux*size+uy*size*.55,y-uy*size-ux*size*.55);ctx.closePath();ctx.fill();
 })
 .minZoom(.2).maxZoom(6).enableNodeDrag(false).cooldownTicks(0)
 .nodeCanvasObjectMode(()=> 'after').nodeCanvasObject((n,ctx,scale)=>{
   const r=radius(n),age=Date.now()-n.born;
   if(age<1400){ctx.beginPath();ctx.arc(n.x,n.y,r+age/120,0,2*Math.PI);ctx.strokeStyle=color(n);ctx.globalAlpha=.35*(1-age/1400);ctx.lineWidth=1/scale;ctx.stroke();ctx.globalAlpha=1}
   if(n.kind==='agent'){
     ctx.beginPath();ctx.arc(n.x,n.y,r+4/scale,0,2*Math.PI);ctx.strokeStyle='#80cadf55';ctx.lineWidth=1/scale;ctx.stroke();
     ctx.font=`${8/scale}px ui-monospace,Menlo,monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#090f14';ctx.fillText('AGENT',n.x,n.y);
   }
   const size=(n.kind==='agent'?14:11)/scale;ctx.font=`${n.kind==='agent'?'600 ':''}${size}px system-ui`;ctx.textAlign='center';ctx.textBaseline='bottom';
   ctx.lineWidth=3/scale;ctx.strokeStyle='#090f14';ctx.strokeText(n.label,n.x,n.y-r-3/scale);ctx.fillStyle='#f0eee7';ctx.fillText(n.label,n.x,n.y-r-3/scale);
 })
 .onNodeClick(inspect).onLinkClick(inspect).onBackgroundClick(()=>inspect(null))
 .onNodeHover(n=>{hovered=n;document.body.style.cursor=n?'pointer':'default'});
// Render fixed coordinates: no spring solver, reheat, or automatic repositioning.
for(const force of ['charge','link','center'])graph.d3Force(force,null);
function slot(group,id){if(!rowSlots.has(group))rowSlots.set(group,new Map());const map=rowSlots.get(group);if(!map.has(id))map.set(id,map.size);return map.get(id)}
function simplify(data){
 const claims=new Map(data.nodes.filter(n=>n.kind==='claim').map(n=>[n.id,n]));
 const owners=new Map(data.edges.filter(e=>e.kind==='claims').map(e=>[e.target,e.source]));
 const agents=new Map(data.nodes.filter(n=>n.kind==='agent').map(n=>[n.id,{...n,claims:[],files:[],updates:[],context_count:0}]));
 for(const [id,claim] of claims){const agent=agents.get(owners.get(id));if(!agent)continue;agent.claims.push(claim);agent.files.push(...data.edges.filter(e=>e.source===id&&e.kind==='declares').map(e=>data.nodes.find(n=>n.id===e.target)?.label).filter(Boolean))}
 for(const directive of data.nodes.filter(n=>n.kind==='directive'&&n.plan_version===data.plan_version&&n.state!=='superseded')){
   const target=data.edges.find(e=>e.source===directive.id&&e.kind==='notifies')?.target;
   const agent=agents.get(target);if(!agent)continue;agent.updates.push(directive);
 }
 for(const agent of agents.values()){
   agent.files=[...new Set(agent.files)];
   agent.change=agent.updates.some(d=>['queued','delivered','rejected','needs_clarification'].includes(d.state))?'pending':agent.updates.length&&agent.updates.every(d=>d.state==='acknowledged')?'acknowledged':null;
   agent.context_count=agent.files.length;
 }
 const edges=new Map(),interfaces=new Map();
 for(const e of data.edges.filter(e=>['provides','consumes'].includes(e.kind))){
   const owner=owners.get(e.source),agent=agents.get(owner);if(!agent)continue;
   const source=e.kind==='provides'?owner:e.target,target=e.kind==='provides'?e.target:owner;
   const id=source+'|'+e.kind+'|'+target;
   if(!interfaces.has(e.target)){const original=data.nodes.find(n=>n.id===e.target);if(!original)continue;interfaces.set(e.target,{...original,shared_by:0})}
   const existing=edges.get(id);
   if(existing){existing.claim_ids.push(e.source);existing.declarations.push({claim_id:e.source,fields:e.fields})}
   else edges.set(id,{id,source,target,kind:e.kind,fields:e.fields,claim_ids:[e.source],declarations:[{claim_id:e.source,fields:e.fields}],change:agent.change});
 }
 for(const agent of agents.values())agent.context_count=agent.files.length+new Set([...edges.values()].filter(e=>e.source===agent.id||e.target===agent.id).map(e=>e.source===agent.id?e.target:e.source)).size;
 for(const n of interfaces.values())n.shared_by=new Set([...edges.values()].filter(e=>e.source===n.id||e.target===n.id).flatMap(e=>e.claim_ids)).size;
 return {...data,nodes:[...agents.values(),...interfaces.values()],edges:[...edges.values()]};
}
function hierarchy(data){
 for(const n of data.nodes){
   let p;
   if(n.kind==='agent'){
     if(!lanes.has(n.id))lanes.set(n.id,lanes.size);
     p={x:lanes.get(n.id)*260-390,y:-160};
   }else{
     const i=slot('interfaces',n.id);
     p={x:(i%2?1:-1)*(130+Math.floor(i/2)*260),y:120};
   }
   Object.assign(nodes.get(n.id),p,{fx:p.x,fy:p.y,vx:0,vy:0});
 }
}
function fit(){
 const all=[...nodes.values()];
 const left=Math.min(-520,...all.map(n=>n.x-80)),right=Math.max(520,...all.map(n=>n.x+80));
 const top=Math.min(-260,...all.map(n=>n.y-80)),bottom=Math.max(260,...all.map(n=>n.y+80));
 graph.centerAt((left+right)/2,(top+bottom)/2,0);
 graph.zoom(Math.min((innerWidth-70)/(right-left),(innerHeight-160)/(bottom-top)),0);
}
fit();
async function connection(){const r=await fetch('/connection');if(!r.ok)throw Error('Connection unavailable');key=(await r.json()).key}
async function post(url){const r=await fetch(url,{method:'POST',headers:{'x-demo-key':key}});if(!r.ok)throw Error('Request failed ('+r.status+')');return r.json()}
function draw(raw){
 const data=simplify(raw);
 if(project!==data.project){project=data.project;nodes.clear();links.clear();lanes.clear();rowSlots.clear();signature='';inspect(null);graph.graphData({nodes:[],links:[]});fit()}
 const ids=new Set(data.nodes.map(n=>n.id)),edgeIds=new Set(data.edges.map(l=>l.id));
 for(const id of nodes.keys())if(!ids.has(id))nodes.delete(id);
 for(const id of links.keys())if(!edgeIds.has(id))links.delete(id);
 for(const n of data.nodes){const existing=nodes.get(n.id);if(existing)Object.assign(existing,n);else{
   nodes.set(n.id,{...n,born:Date.now()});
 }}
 for(const l of data.edges){const existing=links.get(l.id);if(existing){const {source,target,...details}=l;Object.assign(existing,details)}else links.set(l.id,{...l})}
 const next=JSON.stringify([data.nodes.map(n=>n.id).sort(),data.edges.map(l=>l.id).sort()]);
 if(next!==signature){signature=next;hierarchy(data);graph.graphData({nodes:[...nodes.values()],links:[...links.values()]})}
 if(selected){const updated=nodes.get(selected.id)||links.get(selected.id);inspect(updated||null)}
 $('empty').hidden=data.nodes.length>0;$('status').textContent=`${data.nodes.filter(n=>n.kind==='agent').length} agents · ${data.nodes.filter(n=>n.kind==='interface').length} interfaces`;$('source').title=data.source+' · '+data.project;$('start').hidden=data.started;$('start').disabled=busy;
}
async function refresh(){if(busy||polling)return;polling=true;try{if(!key)await connection();const r=await fetch('/graph-state',{headers:{'x-demo-key':key}});if(r.status===403){await connection();return}if(!r.ok)throw Error('Graph unavailable');draw(await r.json())}catch(e){$('status').textContent='Waiting for live service…'}finally{polling=false}}
$('start').onclick=async()=>{busy=true;$('start').disabled=true;$('status').textContent='Starting agents…';try{await post('/peer-start')}catch(e){$('status').textContent=e.message}finally{busy=false;refresh()}};
$('reset').onclick=async()=>{busy=true;$('reset').disabled=true;$('status').textContent='Resetting…';try{await post('/reset?start=false');await connection()}catch(e){$('status').textContent=e.message}finally{busy=false;$('reset').disabled=false;refresh()}};
$('fit').onclick=fit;$('close').onclick=()=>inspect(null);
$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
addEventListener('resize',()=>{graph.width(innerWidth).height(innerHeight);fit()});
refresh();setInterval(refresh,800);
</script></html>
